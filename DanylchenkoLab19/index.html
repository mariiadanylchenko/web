<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Тваринна гра — Lab19</title>
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    #start-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 90vh;
      gap: 24px;
    }
    #start-screen h1 { font-size: 42px; }
    #start-screen p  { font-size: 18px; color: #555; }

    #category-buttons { display: flex; gap: 14px; }
    .cat-btn {
      padding: 10px 28px;
      font-size: 16px;
      border-radius: 8px;
      border: 2px solid #5b8fc9;
      background: white;
      color: #5b8fc9;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .cat-btn.active,
    .cat-btn:hover { background: #5b8fc9; color: white; }

    .btn {
      padding: 12px 36px;
      font-size: 18px;
      border-radius: 10px;
      border: none;
      background: #5b8fc9;
      color: white;
      cursor: pointer;
    }
    .btn:hover { background: #4a7ab5; }
    .btn:disabled { background: #aaa; cursor: not-allowed; }

    #game-screen { display: none; }

    #game-header {
      text-align: center;
      margin-bottom: 18px;
      font-size: 16px;
      color: #777;
    }

    #game-layout {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 60px;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(5, 110px);
      grid-template-rows: repeat(5, 110px);
      border: 2px solid #333;
      background: white;
    }

    .cell {
      width: 110px;
      height: 110px;
      border: 1px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 58px;
      background: white;
      transition: background 0.15s;
      position: relative;
    }
    .cell.drop-hover  { background: #eaf0fb; outline: 2px solid #5b8fc9; }
    .cell.matched     { background: #d4f5de; opacity: 0.6; cursor: default; }
    .cell.wrong-flash { background: #ffe0e0; }

    #right-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      padding-top: 8px;
    }

    #current-card-label {
      font-size: 15px;
      color: #555;
      text-align: center;
    }

    #current-card {
      width: 140px;
      height: 140px;
      border: 2px solid #5b8fc9;
      border-radius: 6px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 78px;
      cursor: grab;
      user-select: none;
    }
    #current-card:active { cursor: grabbing; }

    .ui-draggable-dragging { pointer-events: none; }

    #progress {
      font-size: 16px;
      color: #555;
    }
  </style>
</head>
<body>

  <div id="start-screen">
    <h1>Моя друга гра</h1>
    <div id="category-buttons">
      <button class="cat-btn" data-cat="animals">Тварини</button>
      <button class="cat-btn" data-cat="insects">Комахи</button>
      <button class="cat-btn" data-cat="fish">Риби</button>
    </div>
    <button class="btn" id="btn-start" disabled>Почати гру</button>
  </div>

  <div id="game-screen">
    <div id="game-header">
      Розділ: <strong id="cat-name"></strong>
    </div>

    <div id="game-layout">
      <div id="grid"></div>

      <div id="right-panel">
        <button class="btn" id="btn-restart">Почати з початку</button>
        <div>
          <div id="current-card-label">Знайдіть та перетягніть:</div>
          <div id="current-card"></div>
        </div>
        <div id="progress"></div>
      </div>
    </div>
  </div>

  <script>
    const POOL = {
      animals: [
        '🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯',
        '🦁','🐮','🐷','🐸','🐵','🐔','🐧','🦆','🦅','🦉',
        '🦇','🐺','🐗','🐴','🦄','🐢','🦎','🐊','🐅','🐆',
        '🦓','🦍','🐘','🦛','🦏','🐪','🐫','🦒','🦘','🦬',
        '🐃','🐄','🐎','🐖','🐏','🐑','🦙','🐐','🦌','🐕'
      ],
      insects: [
        '🐝','🐛','🦋','🐌','🐞','🐜','🦟','🦗','🕷','🦂',
        '🪲','🪳','🪰','🪱','🕸','🦀','🦞','🦐','🦑','🐙',
        '🪼','🦠','🐚','🌿','🍄'
      ],
      fish: [
        '🐡','🐠','🐟','🐬','🐳','🐋','🦈','🦭','🦀','🦞',
        '🦐','🦑','🐙','🪼','🐚','🐊','🐢','🦎','🐸','🦦',
        '🌊','🪸','🎣','🤿','🏄'
      ]
    };

    const CAT_LABELS = {
      animals: 'Тварини',
      insects: 'Комахи',
      fish:    'Риби'
    };

    const GRID_SIZE = 25;

    let selectedCat = null;
    let gridEmojis  = [];
    let matched     = [];
    let currentIdx  = -1;

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildGrid(cat) {
      gridEmojis = shuffle(POOL[cat]).slice(0, GRID_SIZE);
      matched    = new Array(GRID_SIZE).fill(false);

      const $grid = $('#grid').empty();

      gridEmojis.forEach((emoji, idx) => {
        const $cell = $('<div class="cell">')
          .text(emoji)
          .attr('data-idx', idx)
          .appendTo($grid);

        $cell.droppable({
          accept:     '#current-card',
          hoverClass: 'drop-hover',
          drop: function(event, ui) {
            onDrop(idx, $cell);
          }
        });
      });
    }

    function setCurrentCard() {
      const unmatched = matched
        .map((done, i) => (done ? null : i))
        .filter(i => i !== null);

      if (unmatched.length === 0) {
        setTimeout(() => {
          alert('Вітаємо! Ви знайшли всі збіги! Починаємо спочатку.');
          startRound(selectedCat);
        }, 80);
        return;
      }

      currentIdx = unmatched[Math.floor(Math.random() * unmatched.length)];
      $('#current-card').text(gridEmojis[currentIdx]);

      const done = GRID_SIZE - unmatched.length;
      $('#progress').text(`Знайдено: ${done} / ${GRID_SIZE}`);
    }

    function onDrop(cellIdx, $cell) {
      if (matched[cellIdx]) return;

      if (gridEmojis[cellIdx] === gridEmojis[currentIdx]) {
        matched[cellIdx] = true;
        $cell.addClass('matched');
        setCurrentCard();
      } else {
        $cell.addClass('wrong-flash');
        setTimeout(() => $cell.removeClass('wrong-flash'), 400);
      }
    }

    function startRound(cat) {
      selectedCat = cat;
      $('#cat-name').text(CAT_LABELS[cat]);
      buildGrid(cat);

      const $card = $('#current-card');
      if ($card.hasClass('ui-draggable')) $card.draggable('destroy');
      $card.draggable({
        helper:    'clone',
        zIndex:    1000,
        opacity:   0.9,
        cursorAt:  { top: 70, left: 70 }
      });

      setCurrentCard();
    }

    $('.cat-btn').on('click', function () {
      $('.cat-btn').removeClass('active');
      $(this).addClass('active');
      selectedCat = $(this).data('cat');
      $('#btn-start').prop('disabled', false);
    });

    $('#btn-start').on('click', () => {
      $('#start-screen').hide();
      $('#game-screen').show();
      startRound(selectedCat);
    });

    $('#btn-restart').on('click', () => {
      startRound(selectedCat);
    });
  </script>
</body>
</html>
